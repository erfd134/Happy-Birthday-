<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#050509">

<title>Happy Birthday Miss Uswa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap"
  rel="stylesheet"
>

<style>

/* =========================================================
   GLOBAL
========================================================= */

:root{
  --bg:#040509;
  --cream:#f7eee6;
  --soft:#d9d0ca;
  --rose:#d69aad;
  --rose-light:#efb8c8;
  --gold:#c8aa7b;
  --gold-light:#ead0a3;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  background:var(--bg);
}

body{
  min-height:100vh;
  overflow-x:hidden;

  background:#040509;
  color:white;

  font-family:"Montserrat",sans-serif;

  -webkit-font-smoothing:antialiased;
}


/* =========================================================
   INTRO SCREEN
========================================================= */

.intro{
  position:fixed;
  inset:0;

  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      #181017 0%,
      #08070a 45%,
      #020204 100%
    );

  transition:
    opacity 1.4s ease,
    visibility 1.4s ease;
}

.intro.hide{
  opacity:0;
  visibility:hidden;
}

.intro-content{
  text-align:center;
  padding:25px;
}

.intro-small{
  font-size:8px;
  letter-spacing:7px;
  text-transform:uppercase;
  color:rgba(255,255,255,.38);

  opacity:0;

  animation:
    introSmall 1s .3s ease forwards;
}

.intro-name{
  margin-top:18px;

  font-family:"Great Vibes",cursive;
  font-size:clamp(65px,10vw,130px);
  font-weight:400;

  color:#e6adbf;

  text-shadow:
    0 0 45px rgba(222,141,170,.13);

  opacity:0;

  transform:translateY(15px);

  animation:
    introName 1.4s .8s ease forwards;
}

.intro-line{
  width:0;
  height:1px;

  margin:22px auto 0;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(215,181,130,.7),
      transparent
    );

  animation:
    introLine 1.4s 1.3s ease forwards;
}

@keyframes introSmall{
  to{
    opacity:1;
  }
}

@keyframes introName{
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes introLine{
  to{
    width:180px;
  }
}


/* =========================================================
   HERO
========================================================= */

.hero{
  position:relative;

  width:100%;
  height:100vh;
  height:100svh;

  min-height:650px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
  isolation:isolate;

  background:

    radial-gradient(
      ellipse at 50% -5%,
      rgba(66,91,126,.19),
      transparent 42%
    ),

    radial-gradient(
      circle at 78% 30%,
      rgba(113,62,84,.09),
      transparent 26%
    ),

    radial-gradient(
      circle at 20% 40%,
      rgba(86,61,82,.07),
      transparent 24%
    ),

    linear-gradient(
      180deg,
      #020711 0%,
      #070d17 36%,
      #0c0b12 65%,
      #100a0e 82%,
      #040406 100%
    );
}


/* =========================================================
   STAR FIELD
========================================================= */

#stars{
  position:absolute;
  inset:0;
  z-index:-10;
}

.star{
  position:absolute;

  width:var(--size);
  height:var(--size);

  border-radius:50%;

  background:var(--color);

  opacity:var(--opacity);

  box-shadow:
    0 0 var(--glow) var(--color);

  animation:
    twinkle var(--speed)
    ease-in-out infinite;

  animation-delay:var(--delay);
}

@keyframes twinkle{
  0%,100%{
    opacity:calc(var(--opacity) * .4);
    transform:scale(.7);
  }

  50%{
    opacity:var(--opacity);
    transform:scale(1.15);
  }
}

.star.bright::before,
.star.bright::after{
  content:"";

  position:absolute;
  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  background:var(--color);

  opacity:.25;
}

.star.bright::before{
  width:1px;
  height:10px;
}

.star.bright::after{
  width:10px;
  height:1px;
}


/* =========================================================
   MOON
========================================================= */

.moon-wrap{
  position:absolute;

  top:8%;
  right:10%;

  width:110px;
  height:110px;

  z-index:-8;
}

.moon-glow{
  position:absolute;
  inset:-100px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(178,205,235,.13),
      rgba(100,145,193,.05) 35%,
      transparent 67%
    );

  filter:blur(10px);
}

.moon{
  position:absolute;
  inset:0;

  border-radius:50%;

  background:

    radial-gradient(
      circle at 31% 27%,
      rgba(112,123,140,.18) 0 7%,
      transparent 8%
    ),

    radial-gradient(
      circle at 67% 36%,
      rgba(112,123,140,.15) 0 9%,
      transparent 10%
    ),

    radial-gradient(
      circle at 45% 68%,
      rgba(112,123,140,.12) 0 11%,
      transparent 12%
    ),

    radial-gradient(
      circle at 40% 38%,
      #fafbf8,
      #e9edef 42%,
      #c6ced3 73%,
      #9ca8af 100%
    );

  box-shadow:
    0 0 15px rgba(235,243,249,.6),
    0 0 42px rgba(169,201,232,.25),
    0 0 100px rgba(93,138,189,.12);
}


/* =========================================================
   SHOOTING STAR
========================================================= */

.shooting-star{
  position:absolute;

  left:-20%;
  top:20%;

  width:140px;
  height:1px;

  z-index:-7;

  opacity:0;

  transform:rotate(-17deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(215,229,246,.28),
      rgba(255,255,255,.9)
    );

  animation:
    shoot 13s linear infinite;
}

.shooting-star.two{
  top:34%;
  animation-delay:7s;
  animation-duration:18s;
}

@keyframes shoot{
  0%,72%{
    opacity:0;

    transform:
      translate(0,0)
      rotate(-17deg);
  }

  74%{
    opacity:.7;
  }

  82%{
    opacity:0;

    transform:
      translate(125vw,180px)
      rotate(-17deg);
  }

  100%{
    opacity:0;
  }
}


/* =========================================================
   MOUNTAINS
========================================================= */

.landscape{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:43%;

  z-index:-6;
}

.mountain-back{
  position:absolute;

  bottom:10%;

  width:100%;
  height:75%;

  background:#091019;

  opacity:.72;

  clip-path:polygon(
    0 75%,
    8% 62%,
    17% 69%,
    26% 39%,
    36% 67%,
    44% 50%,
    54% 69%,
    64% 35%,
    74% 62%,
    83% 44%,
    92% 68%,
    100% 54%,
    100% 100%,
    0 100%
  );
}

.mountain-front{
  position:absolute;

  bottom:0;

  width:100%;
  height:62%;

  background:
    linear-gradient(
      #080c11,
      #030405
    );

  clip-path:polygon(
    0 65%,
    11% 50%,
    20% 72%,
    31% 55%,
    42% 74%,
    53% 58%,
    63% 72%,
    75% 51%,
    86% 70%,
    100% 49%,
    100% 100%,
    0 100%
  );
}


/* =========================================================
   CITY LIGHTS
========================================================= */

#city{
  position:absolute;

  left:0;
  right:0;
  bottom:14%;

  height:65px;

  z-index:-5;
}

.city-light{
  position:absolute;

  width:2px;
  height:2px;

  border-radius:50%;

  background:#d0a66c;

  box-shadow:
    0 0 5px rgba(208,166,108,.55);
}


/* =========================================================
   FLOOR
========================================================= */

.floor{
  position:absolute;

  left:-5%;
  bottom:-18%;

  width:110%;
  height:35%;

  z-index:-4;

  transform:
    perspective(700px)
    rotateX(61deg);

  transform-origin:bottom;

  background:

    linear-gradient(
      rgba(255,255,255,.014) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,255,255,.014) 1px,
      transparent 1px
    ),

    linear-gradient(
      #0d0b0d,
      #040405
    );

  background-size:
    90px 70px,
    90px 70px,
    auto;
}


/* =========================================================
   ROSES
========================================================= */

.flower-area{
  position:absolute;

  bottom:-20px;

  width:290px;
  height:320px;

  z-index:3;

  pointer-events:none;
}

.flower-area.left{
  left:-75px;
}

.flower-area.right{
  right:-75px;

  transform:scaleX(-1);
}

.branch{
  position:absolute;

  left:80px;
  bottom:0;

  width:7px;
  height:300px;

  border-radius:100%;

  background:#10150f;

  transform:rotate(31deg);
}

.leaf{
  position:absolute;

  width:48px;
  height:21px;

  border-radius:
    100% 0 100% 0;

  background:
    linear-gradient(
      135deg,
      #293220,
      #090d09
    );

  box-shadow:
    0 7px 18px rgba(0,0,0,.6);
}

.rose{
  position:absolute;

  width:46px;
  height:46px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #ca748f 0 8%,
      #a64b66 9% 22%,
      #752740 23% 39%,
      #471426 40% 56%,
      #210a13 57% 67%,
      transparent 69%
    );

  filter:
    drop-shadow(
      0 5px 10px rgba(0,0,0,.7)
    );
}


/* =========================================================
   FLOATING PETALS
========================================================= */

#petals{
  position:absolute;
  inset:0;

  z-index:4;

  overflow:hidden;

  pointer-events:none;
}

.petal{
  position:absolute;

  top:-30px;

  width:10px;
  height:14px;

  border-radius:
    80% 10% 80% 10%;

  background:
    linear-gradient(
      135deg,
      #d99caf,
      #7f3c54
    );

  opacity:.6;

  animation:
    petalFall linear infinite;
}

@keyframes petalFall{
  from{
    transform:
      translateY(-40px)
      translateX(0)
      rotate(0deg);
  }

  to{
    transform:
      translateY(115vh)
      translateX(var(--drift))
      rotate(520deg);
  }
}


/* =========================================================
   MAIN HERO CONTENT
========================================================= */

.content{
  position:relative;

  z-index:10;

  width:min(920px,92%);

  text-align:center;
}

.mini-title{
  margin-bottom:13px;

  font-size:8px;

  letter-spacing:7px;

  text-transform:uppercase;

  color:
    rgba(224,207,198,.53);

  animation:
    fadeUp 1s ease both;
}

.happy{
  font-family:
    "Great Vibes",
    cursive;

  font-size:
    clamp(75px,10vw,140px);

  line-height:.78;

  font-weight:400;

  color:#e5adbf;

  text-shadow:
    0 5px 30px rgba(0,0,0,.5);

  animation:
    fadeUp 1.3s .15s ease both;
}

.name{
  margin-top:18px;

  font-family:
    "Cormorant Garamond",
    serif;

  font-size:
    clamp(45px,6vw,80px);

  line-height:1;

  font-weight:400;

  letter-spacing:2px;

  color:#f6eee7;

  text-shadow:
    0 7px 30px rgba(0,0,0,.6);

  animation:
    fadeUp 1.3s .3s ease both;
}

.ornament{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:11px;

  margin:22px 0 15px;
}

.line{
  width:60px;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(205,173,124,.55)
    );
}

.line.right{
  transform:scaleX(-1);
}

.diamond{
  width:6px;
  height:6px;

  border:
    1px solid rgba(226,192,141,.7);

  transform:rotate(45deg);
}

.tagline{
  font-family:
    "Cormorant Garamond",
    serif;

  font-size:
    clamp(17px,1.7vw,21px);

  line-height:1.5;

  letter-spacing:1px;

  color:
    rgba(245,236,228,.68);

  animation:
    fadeUp 1.3s .45s ease both;
}

.tagline strong{
  color:#e0aabc;
  font-weight:400;
}


/* =========================================================
   BUTTON
========================================================= */

.begin{
  position:relative;

  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:13px;

  min-width:225px;

  margin-top:30px;

  padding:15px 26px;

  overflow:hidden;

  border:
    1px solid rgba(207,176,129,.4);

  border-radius:40px;

  background:
    rgba(255,255,255,.035);

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

  color:#eee2d7;

  text-decoration:none;

  font-family:"Montserrat",sans-serif;

  font-size:9px;

  letter-spacing:2.3px;

  text-transform:uppercase;

  box-shadow:
    inset 0 1px rgba(255,255,255,.06),
    0 15px 35px rgba(0,0,0,.25);

  transition:
    transform .35s ease,
    background .35s ease,
    border-color .35s ease;

  animation:
    fadeUp 1.3s .6s ease both;
}

.begin::before{
  content:"";

  position:absolute;

  top:0;
  left:-100%;

  width:80%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.08),
      transparent
    );

  transform:skewX(-25deg);

  transition:left .7s ease;
}

.begin:hover{
  transform:translateY(-4px);

  background:
    rgba(255,255,255,.055);

  border-color:
    rgba(220,187,137,.65);
}

.begin:hover::before{
  left:130%;
}

.arrow{
  font-size:16px;

  color:#d5a1b1;

  transition:
    transform .3s ease;
}

.begin:hover .arrow{
  transform:translateX(5px);
}


/* =========================================================
   PAGE NAVIGATION
========================================================= */

.page-nav{
  position:absolute;

  left:50%;
  bottom:24px;

  transform:translateX(-50%);

  z-index:20;

  display:flex;

  align-items:center;

  gap:6px;

  padding:6px;

  border:
    1px solid rgba(255,255,255,.07);

  border-radius:40px;

  background:
    rgba(3,4,7,.42);

  backdrop-filter:blur(15px);

  -webkit-backdrop-filter:blur(15px);

  box-shadow:
    0 15px 35px rgba(0,0,0,.25);
}

.nav-link{
  display:flex;

  align-items:center;
  justify-content:center;

  padding:9px 15px;

  border-radius:30px;

  color:
    rgba(255,255,255,.48);

  text-decoration:none;

  font-family:
    "Cormorant Garamond",
    serif;

  font-size:13px;

  letter-spacing:.6px;

  transition:.3s ease;
}

.nav-link:hover,
.nav-link.active{
  color:#f4e7df;

  background:
    rgba(255,255,255,.055);
}


/* =========================================================
   CONFETTI
========================================================= */

#confetti{
  position:fixed;
  inset:0;

  z-index:100;

  pointer-events:none;

  overflow:hidden;
}

.confetti-piece{
  position:absolute;

  top:-30px;

  width:6px;
  height:10px;

  opacity:.8;

  animation:
    confettiFall linear forwards;
}

@keyframes confettiFall{
  to{
    transform:
      translateY(110vh)
      translateX(var(--x))
      rotate(720deg);

    opacity:.2;
  }
}


/* =========================================================
   VIGNETTE
========================================================= */

.vignette{
  position:absolute;

  inset:0;

  z-index:5;

  pointer-events:none;

  background:

    linear-gradient(
      90deg,
      rgba(0,0,0,.52),
      transparent 18%,
      transparent 82%,
      rgba(0,0,0,.52)
    ),

    linear-gradient(
      180deg,
      rgba(0,0,0,.05),
      transparent 55%,
      rgba(0,0,0,.48)
    );
}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes fadeUp{
  from{
    opacity:0;

    transform:
      translateY(20px);

    filter:blur(3px);
  }

  to{
    opacity:1;

    transform:none;

    filter:blur(0);
  }
}


/* =========================================================
   MOBILE / SAMSUNG GALAXY
========================================================= */

@media(max-width:600px){

  .hero{
    min-height:100svh;
  }

  .content{
    width:
      calc(100% - 30px);

    transform:
      translateY(-15px);
  }

  .moon-wrap{
    width:70px;
    height:70px;

    top:6%;
    right:7%;
  }

  .mini-title{
    font-size:7px;

    letter-spacing:4px;
  }

  .happy{
    font-size:
      clamp(68px,21vw,92px);
  }

  .name{
    margin-top:16px;

    font-size:
      clamp(40px,12vw,56px);

    letter-spacing:1px;
  }

  .ornament{
    margin:
      19px 0 13px;
  }

  .tagline{
    width:90%;

    margin:auto;

    font-size:16px;
  }

  .begin{
    min-width:210px;

    margin-top:26px;

    padding:14px 22px;

    font-size:8px;
  }

  .page-nav{
    bottom:
      calc(
        12px +
        env(safe-area-inset-bottom)
      );

    max-width:
      calc(100% - 18px);

    gap:2px;

    padding:4px;
  }

  .nav-link{
    padding:
      8px 9px;

    font-size:11px;
  }

  .flower-area.left{
    left:-150px;

    opacity:.65;
  }

  .flower-area.right{
    right:-150px;

    opacity:.65;
  }
}


/* =========================================================
   GALAXY A / S SMALL
========================================================= */

@media(max-width:380px){

  .content{
    width:
      calc(100% - 20px);
  }

  .happy{
    font-size:66px;
  }

  .name{
    font-size:39px;
  }

  .tagline{
    font-size:14px;
  }

  .nav-link{
    padding:
      8px 7px;

    font-size:10px;
  }

}


/* =========================================================
   GALAXY FOLD
========================================================= */

@media(max-width:320px){

  .happy{
    font-size:58px;
  }

  .name{
    font-size:34px;
  }

  .page-nav{
    width:
      calc(100% - 12px);

    justify-content:center;
  }

  .nav-link{
    padding:
      7px 5px;

    font-size:9px;
  }

}


/* =========================================================
   SHORT MOBILE
========================================================= */

@media(max-width:600px) and (max-height:700px){

  .content{
    transform:
      scale(.88)
      translateY(-15px);
  }

  .moon-wrap{
    width:55px;
    height:55px;

    top:4%;
  }

  .page-nav{
    bottom:5px;
  }

}


/* =========================================================
   TABLET
========================================================= */

@media(min-width:601px) and (max-width:1100px){

  .content{
    width:85%;
  }

}


/* =========================================================
   4K
========================================================= */

@media(min-width:1800px){

  .content{
    transform:scale(1.15);
  }

  .moon-wrap{
    width:140px;
    height:140px;
  }

}


/* =========================================================
   8K
========================================================= */

@media(min-width:3000px){

  .content{
    transform:scale(1.5);
  }

  .moon-wrap{
    width:190px;
    height:190px;
  }

}


/* =========================================================
   ACCESSIBILITY
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     INTRO
===================================================== -->

<div class="intro" id="intro">

  <div class="intro-content">

    <p class="intro-small">
      Today Is Your Day
    </p>

    <h1 class="intro-name">
      Miss Uswa
    </h1>

    <div class="intro-line"></div>

  </div>

</div>


<!-- =====================================================
     CONFETTI
===================================================== -->

<div id="confetti"></div>


<!-- =====================================================
     HERO
===================================================== -->

<main class="hero">


  <!-- stars -->

  <div id="stars"></div>


  <!-- shooting stars -->

  <div class="shooting-star"></div>

  <div class="shooting-star two"></div>


  <!-- moon -->

  <div class="moon-wrap">

    <div class="moon-glow"></div>

    <div class="moon"></div>

  </div>


  <!-- landscape -->

  <div class="landscape">

    <div class="mountain-back"></div>

    <div class="mountain-front"></div>

  </div>


  <!-- city lights -->

  <div id="city"></div>


  <!-- floor -->

  <div class="floor"></div>


  <!-- petals -->

  <div id="petals"></div>


  <!-- =================================================
       LEFT FLOWERS
  ================================================== -->

  <div class="flower-area left">

    <div class="branch"></div>

    <span
      class="leaf"
      style="
      left:78px;
      bottom:65px;
      transform:rotate(20deg)"
    ></span>

    <span
      class="leaf"
      style="
      left:105px;
      bottom:110px;
      transform:rotate(58deg)"
    ></span>

<script>

/* =========================================================
   INTRO
========================================================= */

const intro =
  document.getElementById("intro");


window.addEventListener(
  "load",
  function(){

    setTimeout(
      function(){

        intro.classList.add(
          "hide"
        );

        createConfetti();

      },
      2800
    );

  }
);


/* =========================================================
   STARS
========================================================= */

const stars =
  document.getElementById("stars");


const starColors = [

  "#ffffff",
  "#f3f6ff",
  "#dfe9ff",
  "#f5f1e8",
  "#eadfc8"

];


const totalStars =

  window.innerWidth <= 600

  ? 100

  : 175;


for(
  let i = 0;
  i < totalStars;
  i++
){

  const star =
    document.createElement(
      "span"
    );


  star.className =
    "star";


  const random =
    Math.random();


  let size;


  if(random < .84){

    size =
      Math.random() * .75 + .35;

  }

  else if(random < .97){

    size =
      Math.random() * 1 + .8;

  }

  else{

    size =
      Math.random() * 1.2 + 1.4;

    star.classList.add(
      "bright"
    );

  }


  const color =

    starColors[

      Math.floor(
        Math.random()
        *
        starColors.length
      )

    ];


  star.style.left =
    Math.random() * 100 + "%";


  star.style.top =
    Math.random() * 72 + "%";


  star.style.setProperty(
    "--size",
    size + "px"
  );


  star.style.setProperty(
    "--color",
    color
  );


  star.style.setProperty(
    "--opacity",
    Math.random() * .55 + .25
  );


  star.style.setProperty(
    "--glow",
    size * 2.4 + "px"
  );


  star.style.setProperty(
    "--speed",
    Math.random() * 5 + 4 + "s"
  );


  star.style.setProperty(
    "--delay",
    Math.random() * -8 + "s"
  );


  stars.appendChild(
    star
  );

}


/* =========================================================
   CITY LIGHTS
========================================================= */

const city =
  document.getElementById("city");


for(
  let i = 0;
  i < 45;
  i++
){

  const light =
    document.createElement(
      "span"
    );


  light.className =
    "city-light";


  light.style.left =
    Math.random() * 100 + "%";


  light.style.bottom =
    Math.random() * 45 + "px";


  light.style.opacity =
    Math.random() * .5 + .15;


  city.appendChild(
    light
  );

}


/* =========================================================
   PETALS
========================================================= */

const petals =
  document.getElementById("petals");


const petalCount =

  window.innerWidth <= 600

  ? 12

  : 22;


for(
  let i = 0;
  i < petalCount;
  i++
){

  const petal =
    document.createElement(
      "span"
    );


  petal.className =
    "petal";


  petal.style.left =
    Math.random() * 100 + "%";


  petal.style.animationDuration =
    Math.random() * 7 + 9 + "s";


  petal.style.animationDelay =
    Math.random() * -14 + "s";


  petal.style.setProperty(
    "--drift",
    Math.random() * 150 - 75 + "px"
  );


  const scale =
    Math.random() * .7 + .5;


  petal.style.transform =
    "scale(" + scale + ")";


  petals.appendChild(
    petal
  );

}


/* =========================================================
   CONFETTI ENTRANCE
========================================================= */

function createConfetti(){

  const container =
    document.getElementById(
      "confetti"
    );


  const colors = [

    "#d8a2b3",
    "#e9d2aa",
    "#f4eee6",
    "#b68a99"

  ];


  const amount =

    window.innerWidth <= 600

    ? 35

    : 65;


  for(
    let i = 0;
    i < amount;
    i++
  ){

    const piece =
      document.createElement(
        "span"
      );


    piece.className =
      "confetti-piece";


    piece.style.left =
      Math.random() * 100 + "%";


    piece.style.background =

      colors[

        Math.floor(
          Math.random()
          *
          colors.length
        )

      ];


    piece.style.animationDuration =
      Math.random() * 3 + 4 + "s";


    piece.style.animationDelay =
      Math.random() * 1.5 + "s";


    piece.style.setProperty(
      "--x",
      Math.random() * 160 - 80 + "px"
    );


    container.appendChild(
      piece
    );

  }


  /*
     Remove confetti from DOM later
     for performance.
  */

  setTimeout(
    function(){

      container.innerHTML =
        "";

    },
    8500
  );

}

</script>
